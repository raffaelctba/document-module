# Test environment — docker service on mybuilding-test, reached via api-gateway.
spring:
  application:
    name: document-module-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://postgres:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    show-sql: false

documents:
  storage:
    provider: ${DOCUMENTS_STORAGE_PROVIDER:s3}

logging:
  level:
    root: INFO
    com.documents: INFO

gateway:
  identity:
    hmac-secret: ${GATEWAY_INTERNAL_SECRET:dev-gateway-internal-secret}
