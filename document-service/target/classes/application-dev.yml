# Local development — run on the machine, talk to infra/postgres on localhost:5432.
spring:
  application:
    name: document-module-dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    show-sql: true

documents:
  storage:
    provider: ${DOCUMENTS_STORAGE_PROVIDER:memory}

logging:
  level:
    root: INFO
    com.documents: DEBUG

gateway:
  identity:
    hmac-secret: ${GATEWAY_INTERNAL_SECRET:dev-gateway-internal-secret}
