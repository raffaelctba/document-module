# Local development — run on the machine, talk to infra/postgres on localhost:5432.
spring:
  application:
    name: document-module-dev
  # Shared local Postgres already has schema documents from pm-backend V21, V35, and V61.
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    show-sql: true

documents:
  storage:
    provider: ${DOCUMENTS_STORAGE_PROVIDER:memory}
  # Host product catalog examples (not baked into core — config only).
  # Override product-default and allow-lists per deployment.
  owners:
    myproperty:
      - PROPERTY
      - AMENITY
      - USER_PROFILE
      - CONVERSATION
    mycleaning:
      - SITE
      - JOB
      - USER_PROFILE
      - BEFORE_AFTER
  purposes:
    myproperty:
      - COVER
      - GALLERY
      - FLOOR_PLAN
      - CONTRACT
      - INVOICE
      - RECEIPT
      - REPORT
      - PHOTO
      - OTHER
      - AVATAR
      - ID_DOCUMENT
      - LEASE
      - INSPECTION
      - NOTICE
      - APPLICATION
      - INCOME
      - COI
      - CHAT_ATTACHMENT
      - SIGNATURE
      - MINUTES
      - EVICTION
    mycleaning:
      - BEFORE_PHOTO
      - AFTER_PHOTO
      - AVATAR

logging:
  level:
    root: INFO
    com.documents: DEBUG

gateway:
  identity:
    hmac-secret: ${GATEWAY_INTERNAL_SECRET:dev-gateway-internal-secret}
