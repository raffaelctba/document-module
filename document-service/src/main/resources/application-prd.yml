# Production — docker service on mybuilding-prd, reached via api-gateway.
spring:
  # Flyway is HOST-OWNED for schema `documents` (hybrid plan, 2026-10-05): pm-backend applies these
  # migrations on the shared database until a dedicated ownership-transfer PR. Exactly one
  # Flyway writer per schema — do not enable here while pm-backend still migrates `documents`.
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  application:
    name: document-module-prd
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false

documents:
  storage:
    provider: ${DOCUMENTS_STORAGE_PROVIDER:s3}
    bucket: ${DOCUMENTS_BUCKET:mypropertyappbucket}
    key-prefix: ${DOCUMENTS_KEY_PREFIX:prd}

logging:
  level:
    root: WARN
    com.documents: INFO

gateway:
  identity:
    hmac-secret: ${GATEWAY_INTERNAL_SECRET:dev-gateway-internal-secret}
