documents:
  product-default: ${DOCUMENTS_PRODUCT_DEFAULT:platform}
  write-roles:
    - ADMIN
    - MANAGER
    - OWNER
    - DELEGATE
  read-roles:
    - ADMIN
    - MANAGER
    - OWNER
    - DELEGATE
    - MEMBER
  # Generic platform catalog. Host products overlay their own owners/purposes
  # via config (see application-dev.yml for multi-product examples).
  owners:
    platform:
      - USER_PROFILE
      - CONVERSATION
      - SUBJECT
      - RESOURCE
      - WORKSPACE
  purposes:
    platform:
      - COVER
      - GALLERY
      - CONTRACT
      - INVOICE
      - RECEIPT
      - REPORT
      - PHOTO
      - OTHER
      - AVATAR
      - ID_DOCUMENT
      - NOTICE
      - APPLICATION
      - CHAT_ATTACHMENT
      - SIGNATURE
      - ATTACHMENT
  storage:
    provider: ${DOCUMENTS_STORAGE_PROVIDER:memory}
    bucket: ${DOCUMENTS_BUCKET:platform-docs}
    region: ${DOCUMENTS_S3_REGION:us-east-1}
    endpoint: ${DOCUMENTS_S3_ENDPOINT:}
    access-key: ${DOCUMENTS_S3_ACCESS_KEY:}
    secret-key: ${DOCUMENTS_S3_SECRET_KEY:}
    path-style: ${DOCUMENTS_S3_PATH_STYLE:true}
    key-prefix: ${DOCUMENTS_KEY_PREFIX:docs}
    signed-url-ttl: ${DOCUMENTS_SIGNED_URL_TTL:15m}
  # Empty allowlist = any content type. Example: image/*,application/pdf
  allowed-content-types: []
  max-size-bytes: ${DOCUMENTS_MAX_SIZE_BYTES:}
  soft-delete-retention: ${DOCUMENTS_SOFT_DELETE_RETENTION:30d}
  owner-lookup:
    enabled: ${DOCUMENTS_OWNER_LOOKUP_ENABLED:false}
  http:
    max-page-size: ${DOCUMENTS_HTTP_MAX_PAGE_SIZE:100}
